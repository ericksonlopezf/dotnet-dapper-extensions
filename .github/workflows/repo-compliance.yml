name: Repository Compliance & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  compliance-audit:
    name: Compliance & Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Run Architecture & Rules Compliance Script
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.DapperExtensions.slnx

      - name: Build with Strict Diagnostics (TreatWarningsAsErrors)
        run: dotnet build EricksonLopez.DapperExtensions.slnx --no-restore --configuration Release

      - name: Verify Code Formatting & Conventions
        run: dotnet format EricksonLopez.DapperExtensions.slnx --verify-no-changes --no-restore

      - name: Run Unit Tests
        run: dotnet test EricksonLopez.DapperExtensions.slnx --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      - name: Execute Interactive Architecture Showcase (Levels 00-11)
        run: dotnet run --project samples/EricksonLopez.DapperExtensions.Showcase/EricksonLopez.DapperExtensions.Showcase.csproj --no-build --configuration Release --framework net10.0

      - name: Validate NuGet Packages Packaging
        run: dotnet pack EricksonLopez.DapperExtensions.slnx --no-build --configuration Release -o artifacts/
